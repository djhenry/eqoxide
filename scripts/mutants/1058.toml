  [[mutant.edit]]
  file = "crates/eqoxide-nav/src/walker.rs"
  anchor = '''
                        gs.log_msg("zone", &format!(
'''
  replacement = '''
                        if false { gs.log_msg("zone", &format!(
'''

  [[mutant.edit]]
  file = "crates/eqoxide-nav/src/walker.rs"
  anchor = '''
                            gs.cur_hp, ceiling));
'''
  replacement = '''
                            gs.cur_hp, ceiling)); }
'''

[[mutant]]
id = "disclosure-latch-never-set"
description = "PROPERTY: the GATE closes — the disclosure is once per journey, not once per tick. Without the latch every tick of a long descent repeats the line and buries the log it exists to inform."
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-nav/src/walker.rs"
  anchor = '''
                        self.inert_fall_disclosed = true;
'''
  replacement = '''
                        if false { self.inert_fall_disclosed = true; }
'''

[[mutant]]
id = "disclosure-latch-never-reset"
description = "PROPERTY: the gate REOPENS — the latch is per-journey, not per-process. The opposite direction from the row above and a different failure: HP changes between journeys, so a walker inside the guard's reach on one goto may be outside it on the next, and a stuck latch silently withholds a true statement about that one."
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-nav/src/walker.rs"
  anchor = '''
        self.inert_fall_disclosed = false;
'''
  replacement = '''
        if false { self.inert_fall_disclosed = false; }
'''

[[mutant]]
id = "inert-arm-also-blocks"
description = "PROPERTY: the fix does not INVENT a stop where the old code descended. Make the `Inert` arm publish `blocked`/`fall_would_be_lethal` as well. That would be a lie in the cautious direction — the guard did not fire, it cannot fire — and it would change behaviour #1058 does not authorise changing."
expect = "RED"

