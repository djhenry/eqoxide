name = "issue 1005 — the client must never publish a self-HP value the server did not send without marking it"

# Reproduce with:  scripts/mutate.py scripts/mutants/1005.toml
#
# Mutants here are WRAPs rather than deletions (docs/mutation-testing.md): the original text stays in
# the tree and still type-checks, so a verdict measures the BEHAVIOUR rather than the text.
#
# Two rows are INSERTIONS instead, and deliberately so. The #1005 fix DELETES the client-side damage
# arithmetic, so at those two sites the behaviour under test is the absence of code — and there is
# nothing left to wrap. The only honest mutation of an absence is to restore it, which is also the
# strongest available form: RED then means the suite catches the actual bug, not a perturbation of
# it. Both insert the pre-fix code verbatim.
#
# The command is the default (`cargo test --workspace --locked`) — deliberately NOT --all-targets,
# which silently drops the doctest targets.

[[mutant]]
id = "counter-wraps-instead-of-saturating"
description = "WRAP mark_hp_estimated so the counter wraps instead of saturating — enough client-derived writes and hp_verified() hands an agent an unearned true"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-core/src/game_state.rs"
  anchor = '''
        self.unverified_hp_writes = self.unverified_hp_writes.saturating_add(1);
'''
  replacement = '''
        self.unverified_hp_writes = self.unverified_hp_writes.wrapping_add(1);
'''

[[mutant]]
id = "combat-site-restores-the-1005-bug"
description = "Put the pre-fix optimistic subtraction BACK into apply_combat_damage, verbatim — the exact code that published hp: 0 while the server held 214/441. This is the one row that measures the actual defect rather than a perturbation of it. It is an INSERTION rather than a wrap because after the fix there is no call left to wrap: the behaviour under test is the ABSENCE of code, and the only honest mutation of an absence is to restore it."
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-net/src/packet_handler.rs"
  anchor = '''
    // Remember who is swinging at us (hit OR miss) so auto-combat can engage an add that aggros
'''
  replacement = '''
    let beneficial_spell = spellid != 0 && spellid != SPELL_UNKNOWN
        && eqoxide_core::spells::global().is_some_and(|d| d.is_beneficial(spellid));
    if target_id == gs.player_id && damage > 0 && gs.max_hp > 0 && !beneficial_spell {
        gs.cur_hp = (gs.cur_hp - damage).max(0);
        gs.hp_pct = (gs.cur_hp as f32 / gs.max_hp.max(1) as f32) * 100.0;
    }

    // Remember who is swinging at us (hit OR miss) so auto-combat can engage an add that aggros
'''

[[mutant]]
id = "every-write-confirms"
description = "WRAP the from_server branch in write_hp so a client-derived figure confirms the HP just like a server reading"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-core/src/game_state.rs"
  anchor = '''
            if from_server {
                self.hp_confirmed = true;
                self.unverified_hp_writes = 0;
            } else {
                self.mark_hp_estimated();
            }
'''
  replacement = '''
            if false {
                if from_server {
                    self.hp_confirmed = true;
                    self.unverified_hp_writes = 0;
                } else {
                    self.mark_hp_estimated();
                }
            } else {
                self.hp_confirmed = true;
                self.unverified_hp_writes = 0;
            }
'''

[[mutant]]
id = "verified-ignores-the-estimate-debt"
description = "WRAP hp_verified so it reads hp_confirmed alone — a confirmation once earned is never spent by a local write"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-core/src/game_state.rs"
  anchor = '''
        self.hp_confirmed && self.unverified_hp_writes == 0
    }
'''
  replacement = '''
        if false { self.hp_confirmed && self.unverified_hp_writes == 0 } else { self.hp_confirmed }
    }
'''

[[mutant]]
id = "verified-ignores-hp_confirmed"
description = "WRAP hp_verified so it reads the counter alone — an untouched client publishes hp 0/0 as a confirmation"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-core/src/game_state.rs"
  anchor = '''
        self.hp_confirmed && self.unverified_hp_writes == 0
    }
'''
  replacement = '''
        if false { self.hp_confirmed && self.unverified_hp_writes == 0 } else { self.unverified_hp_writes == 0 }
    }
'''

[[mutant]]
id = "key-never-reaches-the-body"
description = "WRAP the get_debug insert — every other file on the path is still correct and the agent still never sees the flag (#409/#801/#817)"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-http/src/observe.rs"
  anchor = '''
        player.insert("hp_verified".into(),            serde_json::json!(player_hp_verified));
'''
  replacement = '''
        if false { player.insert("hp_verified".into(),            serde_json::json!(player_hp_verified)); }
'''

[[mutant]]
id = "profile-seed-not-marked"
description = "WRAP the estimate mark on the PlayerProfile HP seed, whose max is a guess and whose hp_pct is derived from it"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-net/src/packet_handler.rs"
  anchor = '''
            gs.mark_hp_estimated();
'''
  replacement = '''
            if false { gs.mark_hp_estimated(); }
'''

[[mutant]]
id = "death-zero-not-marked"
description = "WRAP the estimate mark on the OP_Death zeroing — the death is authoritative, the number is not"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-net/src/packet_handler.rs"
  anchor = '''
        gs.mark_hp_estimated();
        gs.strategy  = "Dead — POST /v1/lifecycle/respawn to revive".into();
'''
  replacement = '''
        if false { gs.mark_hp_estimated(); }
        gs.strategy  = "Dead — POST /v1/lifecycle/respawn to revive".into();
'''

[[mutant]]
id = "respawn-assumption-confirms"
description = "WRAP the respawn write so the client's full-HP assumption goes back through update_hp and confirms itself"
expect = "RED"

  [[mutant.edit]]
  file = "crates/eqoxide-net/src/packet_handler.rs"
  anchor = '''
    gs.update_hp_estimated(gs.player_id, full, full); // cur=max → hp_pct=100, consistent with hp/hp_max
'''
  replacement = '''
    if false { gs.update_hp_estimated(gs.player_id, full, full); } else { gs.update_hp(gs.player_id, full, full); }
'''

[[mutant]]
id = "fall-damage-site-restores-the-raw-write"
description = "Put the pre-fix fall-damage subtraction BACK beside the OP_ENV_DAMAGE report. DECLARED GREEN: this site is inside ActionLoop::stream_position, which needs a live CharacterController, and no test in the suite drives it. The row is here because leaving it out would let the PR imply a coverage it does not have."
expect = "GREEN"

  [[mutant.edit]]
  file = "crates/eqoxide-net/src/action_loop.rs"
  anchor = '''
                    gs.log_msg("combat",
'''
  replacement = '''
                    gs.cur_hp = (gs.cur_hp - dmg as i32).max(0);
                    gs.log_msg("combat",
'''

[[mutant]]
id = "env-damage-report-never-sent"
description = "WRAP the OP_ENV_DAMAGE send. This is the row that matters most for the deletion being SAFE: the server has no fall detection and reads the magnitude out of EnvDamage2_Struct.damage, so without this packet the player silently never takes fall damage — a worse lie than the one being fixed. DECLARED GREEN, same reason as the row above: nothing in the suite drives ActionLoop::stream_position, so deleting the fall report is currently unguarded. Disclosed, not papered over."
expect = "GREEN"

  [[mutant.edit]]
  file = "crates/eqoxide-net/src/action_loop.rs"
  anchor = '''
                    stream.send_app_packet(OP_ENV_DAMAGE, &build_env_damage_packet(gs.player_id, dmg, DMGTYPE_FALLING));
'''
  replacement = '''
                    if false { stream.send_app_packet(OP_ENV_DAMAGE, &build_env_damage_packet(gs.player_id, dmg, DMGTYPE_FALLING)); }
'''
