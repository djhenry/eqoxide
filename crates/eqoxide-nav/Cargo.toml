[package]
name = "eqoxide-nav"
version = "0.1.0"
edition = "2021"

[lib]
name = "eqoxide_nav"
path = "src/lib.rs"

[features]
# Exposes `zone_assets::ZoneAssetState::test_ready()` — a real `Ready` (flat-floor collision grid)
# — to DOWNSTREAM test builds. `eqoxide-http`'s testkit needs one to build an `HttpState` whose
# world endpoints aren't gated by the #579 loading check, and `Ready` is deliberately impossible to
# fabricate without a collision grid. Off in normal builds.
test-fixtures = []

[dependencies]
# eqoxide-nav sits directly above eqoxide-assets (core ← ipc ← assets ← nav, #544 Step 2f). Internal
# deps are ONLY those three crates — never wgpu/winit/egui/tokio/axum/eq_net/renderer/app/movement/
# http/ui/model. `tracing` and `serde` (for the diagnostics snapshot types, #608, below) are the only
# external deps IN THIS BLOCK; the scope is the point, because [dev-dependencies] at the bottom of
# this file adds `serde_json`, which is external too. Cargo DOES link that into this crate's lib
# target — but only when the lib is rebuilt with `--cfg test`, and as the tree stands that build is
# its only consumer: there is no tests/, benches/ or examples/ dir, so the lib is this crate's only
# target, and every `serde_json` call sits inside a `#[cfg(test)] mod` under src/. Measured both
# directions rather than reasoned about: a non-test reference to `serde_json` added to src/lib.rs
# fails the plain lib build with E0433 while the identical line compiles for the lib test target,
# and commenting the dev-dep out leaves `cargo check -p eqoxide-nav` green but breaks
# `eqoxide-nav (lib test)` at 15 sites, 11 in collision.rs and 4 in diagnostics.rs. The qualifier
# doing the work is the same one src/zone_in.rs spells out for `test-fixtures`: a dev-dependency is
# absent from the lib target's NON-TEST build, not from the lib target. (#1042 review B3: an earlier
# revision of this sentence dropped that qualifier and said flatly that cargo does not make
# `serde_json` available to the lib target — which this crate's own src/ is the counterexample to,
# and which contradicted the qualifier src/zone_in.rs documents for `test-fixtures`.)
# The pathfinding math is all plain `[f32; 3]` arrays, so it needs no glam; gltf comes
# in transitively via eqoxide-assets' `ZoneAssets::from_glb`. (#1035: an earlier revision of this
# comment said "ONLY those three internal crates plus tracing", which the `serde` entry in this same
# block already contradicted. The block scoping is #1042 review N3: an unqualified "the only external
# deps" is the same shape of unclosed closed-set claim that #1035 was filed for.)
eqoxide-core = { path = "../eqoxide-core" }
eqoxide-ipc = { path = "../eqoxide-ipc" }
eqoxide-assets = { path = "../eqoxide-assets" }
tracing = "0.1"
# The debug-snapshot types (`diagnostics`, #608) derive Serialize so the HTTP consumer is a
# structural 1:1 serde projection — no hand-mapped fields that could drift from what nav published.
serde = { version = "1", features = ["derive", "rc"] } # "rc": the snapshot shares its PlanDebug via Arc

[dev-dependencies]
# Enable eqoxide-core's test-fixture constructors (RegionMap::flat_below/water_slab/zone_line_box/…)
# for THIS crate's test build — they're `#[cfg(any(test, feature = "test-fixtures"))]` in core, so
# invisible across the crate boundary otherwise. Dev-deps' features don't activate in release builds.
eqoxide-core = { path = "../eqoxide-core", features = ["test-fixtures"] }
serde_json = "1"
