[package]
name = "eqoxide-agent-ops"
version = "0.1.0"
edition = "2021"

[lib]
name = "eqoxide_agent_ops"
path = "src/lib.rs"

[features]
# Exposes the `testkit` module (otherwise `#[cfg(test)]`-only) to DOWNSTREAM test builds — the
# `OpState` builder + `set_gs`/`ago`/`debug_json` helpers the app crate's integration tests need
# to drive the ops. The app crate enables this in its [dev-dependencies] so tests that need
# `eq_net::packet_handler` (an app-crate module ABOVE this crate) can build an `OpState`.
# Off in normal builds; the release binary never has it.
# Forwards to eqoxide-zone-geometry so `testkit::empty_state` can build a real
# `ZoneAssetState::Ready` — `ZoneAssetState`/`Collision::set_water` live there.
# Forwards to eqoxide-ipc so `testkit::empty_state` can build a `NetHealth::frozen_at` — the pinned
# health clock that stops a downstream op test's status depending on machine load (#760).
test-fixtures = ["eqoxide-zone-geometry/test-fixtures", "eqoxide-ipc/test-fixtures"]

[dependencies]
# eqoxide-agent-ops implements the agent ops served over the agent socket. It sits at the TOP of the extracted-crate stack:
# it reads the model's published read-side snapshots and writes the view→model command IPC slots,
# but it holds no app/renderer/gpu/eq_net-transport state itself. It depends ONLY on the lower
# structural crates — never on the app crate, renderer, models, gpu, wgpu, winit, egui, or the
# eq_net transport/action-loop (the two packet-apply gameplay fns its tests touched live in the app
# crate; those tests were relocated up into an app-crate integration test — see the `test-fixtures`
# feature above).
eqoxide-agent-protocol = { path = "../eqoxide-agent-protocol" }  # Call/CallStatus for ApiDispatcher
eqoxide-core = { path = "../eqoxide-core" }        # game_state / spells / skills / race_class / pet
eqoxide-ipc = { path = "../eqoxide-ipc" }          # the Arc<Mutex<…>> IPC slot bundles + snapshot aliases
eqoxide-command = { path = "../eqoxide-command" }  # CommandState — the typed write-path facade
eqoxide-zone-geometry = { path = "../eqoxide-zone-geometry" }  # zone_assets
eqoxide-crash = { path = "../eqoxide-crash" }      # crash::log_instance — stamps the per-pid crash log
eqoxide-protocol = { path = "../eqoxide-protocol" }  # protocol::ccw_to_cw — heading CCW→CW for the observation
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
# Query-string forms are parsed by hand (see `wire.rs`) so a duplicate key gets the crate's own JSON 400.
serde_urlencoded = "0.7"
form_urlencoded = "1"
arc-swap = "1"
tracing = "0.1"

[dev-dependencies]
# Enable eqoxide-core's `test-fixtures` constructors (`game_state::make_entity`, `#[cfg(test)]` in
# core so invisible across the crate boundary) for THIS crate's test build — `observe.rs`'s
# `debug_clears_target_on_zone_change_408` test seeds an entity with it. Without this, a standalone
# `cargo test -p eqoxide-agent-ops` fails (the `--workspace` run only passed via feature unification).
eqoxide-core = { path = "../eqoxide-core", features = ["test-fixtures"] }
# #643: `Roster::insert_for_test` — this crate's unit tests seed partial/mismatched entity rosters
# (an ids-only fixture, a deliberately mismatched one). DEV-dependency only, so a release build has
# no way to write a roster except `WorldSlots::publish_entities`.
eqoxide-ipc = { path = "../eqoxide-ipc", features = ["test-fixtures"] }
# `test-util` (not in tokio's `full`) enables `#[tokio::test(start_paused = true)]` so the A3
# merchant-buy / interact-give / cast timeout tests (#448) exercise the real timeout elapse in
# virtual time — instantly.
tokio = { version = "1", features = ["full", "test-util"] }
# `test_ready()` — see eqoxide-zone-geometry's `test-fixtures` feature. Needed by this crate's own tests
# (testkit is `#[cfg(test)]` here when the feature is off).
# Same reasoning — `ZoneAssetState::test_ready*`/`Collision::set_water` moved to eqoxide-zone-geometry
# (Task 6); this crate's own `observe.rs`/`move_api.rs`/`testkit.rs` tests call them directly.
eqoxide-zone-geometry = { path = "../eqoxide-zone-geometry", features = ["test-fixtures"] }
