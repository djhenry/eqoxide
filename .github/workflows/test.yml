name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # sccache/mold are configured for local dev boxes and unavailable on hosted runners.
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --workspace --all-targets --locked --keep-going

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Clippy (report only)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  static-visual-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: djhenry/eqoxide_asset_server
          ref: 2582fd333f1c6c83aa0167da597b9065b8bc104b
          path: producer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client -> target
            producer -> target
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked --manifest-path client/Cargo.toml
          cargo fetch --locked --manifest-path producer/Cargo.toml
      - name: Regenerate and decode the shared fixture
        run: client/scripts/check-static-visual-fixture.sh client producer

  static-pbr-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: djhenry/eqoxide_asset_server
          ref: 54f0328488af40c3ddc8da4d23ca6cc7cb8e3c88
          path: producer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client -> target
            producer -> target
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked --manifest-path client/Cargo.toml
          cargo fetch --locked --manifest-path producer/Cargo.toml
      - name: Regenerate and decode the scalar PBR fixture
        run: client/scripts/check-static-pbr-fixture.sh client producer

  static-scene-package-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: djhenry/eqoxide_asset_server
          ref: ccf56db60230113606fdafbe8dabd3910c720b38
          path: producer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client -> target
            producer -> target
      - name: Fetch locked dependencies for both checkouts
        run: |
          cargo fetch --locked --manifest-path client/Cargo.toml
          cargo fetch --locked --manifest-path producer/Cargo.toml
      - name: Regenerate and decode the authored inspection package
        run: bash client/scripts/check-static-scene-package.sh client producer

  static-visual-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan adapter
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Run GPU acceptance tests on Lavapipe
        run: |
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if [[ -f "$icd" ]]; then
              export VK_DRIVER_FILES="$icd"
              break
            fi
          done
          test -n "${VK_DRIVER_FILES:-}"
          cargo test -p eqoxide-renderer --test static_visual --locked -- --include-ignored --test-threads=1
