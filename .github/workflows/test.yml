name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes to a PR don't queue up stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, dependency-free guard: fail the build if local-system detail (absolute home paths,
  # local container names, an inline DB credential) or proprietary-derived content (references to
  # a decompiled commercial client / RE tooling) reappears in a tracked file. This is the durable
  # defense that keeps a one-time scrub from silently regressing on a public repo. See the script
  # for the exact patterns and the (temporary) exclusions.
  #
  # Its reach is TRACKED FILES and nothing else — see the `pr-text` job below for the other public
  # surface (#980). Both jobs read one shared pattern list, `scripts/local-detail-patterns.sh`, so
  # the two scanners cannot drift apart.
  no-local-detail:
    runs-on: ubuntu-latest
    # A ~5-second script — this is generous headroom for consistency with the `test` job below,
    # not because this job has any known hang risk.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: check for local-system detail / proprietary-derived content
        run: bash scripts/check-no-local-detail.sh
      # Catches a string literal whose line-continuation backslash was lost while the code was
      # written, which bakes the source indentation into the message. It compiles and tests pass,
      # so only a reader of the WARN/assert text ever notices — it regressed three times on #641,
      # twice after a manual sweep was reported clean. `--self-test` runs first so a guard that has
      # stopped discriminating fails loudly instead of passing everything.
      - name: check for corrupted wrapped string literals
        run: |
          python3 scripts/check-wrapped-literals.py --self-test
          python3 scripts/check-wrapped-literals.py

  # The other public surface (#980). `check-no-local-detail.sh` above scans TRACKED FILES ONLY, so
  # PR bodies, issue bodies and comments — every one of them public on this public repo — were
  # never looked at by anything. Two PRs in the #975 wave shipped absolute home paths in their
  # bodies with that check GREEN throughout, which is not a bug in the check: it structurally
  # cannot see that text.
  #
  # THIS JOB IS A DETECTOR, NOT A PREVENTER, and the script says so in its own output. GitHub has
  # already published the body and every comment before any workflow can read them. A red run here
  # means "go scrub it now"; a green run means "the current text is clean", NOT "nothing was ever
  # exposed" — the edit history keeps the first version either way.
  #
  # It runs on `pull_request` only: on a `push` to `main` there is no PR number to scan, and
  # silently scanning nothing is exactly the state the script refuses (an empty corpus is an error
  # there, not a pass). `GH_TOKEN` gets the default read-only workflow token, which is enough for
  # every endpoint the script calls; a fork PR is fine because the script only reads.
  #
  # WHAT THIS JOB STRUCTURALLY CANNOT SCAN: a comment posted after the last push. The trigger is
  # `pull_request`, so every run reads the text as it stood at a push, and the last green run keeps
  # asserting a corpus that has since grown. This PR demonstrated it on itself — the only run at the
  # time scanned 2 items, a comment was added 88 seconds later, and that run's `OK — all 2 items
  # clean` still stood. Review comments on the final revision are always in this blind spot, since
  # by definition nothing is pushed after them. Cover them by running the script by hand against the
  # number. Adding an `issue_comment` trigger would close it and is deliberately NOT done here: this
  # workflow's concurrency group is keyed on `github.ref`, which for an `issue_comment` event is the
  # default branch rather than the PR head, so comment-triggered runs would cancel each other and
  # cancel pushes. That is a workflow-structure change, not a one-line trigger addition.
  pr-text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # `--self-test` first, same pattern as check-wrapped-literals above: a scanner that has
      # stopped discriminating must fail loudly rather than pass everything. It runs offline and
      # drives the classifier through one deliberately-dirty item per pattern (the samples live
      # beside the patterns, so adding a pattern without one is a length mismatch, not a silent
      # gap), three clean items, a reach control (empty the pattern list — nothing may flag, and
      # every item must still be classified), an unreadable item (must count toward the corpus and
      # NOT toward `classified`, which is what makes the `classified N/N` line able to disagree),
      # the empty-corpus case, and an assertion on how many checks ran, so a case that stops running
      # fails the step instead of shrinking the output.
      #
      # It also EXECUTES both real scanners with `LOCAL_DETAIL_PATTERNS_FILE` pointing at an empty
      # pattern list and requires each to refuse. That indirection exists for one reason: the first
      # version of these two checks re-derived the refusal in an inline `bash -c` and never invoked
      # either script, so deleting the only real reach guard in the repo left the self-test at full
      # green. Verified both directions at this commit — replacing the guard in
      # `check-no-local-detail.sh` with `if false; then` turns `--self-test` RED (`want '1', got
      # '3'`), and neutering `require_patterns` in `check-pr-text.sh` turns it RED on two more
      # checks; hand-editing each back restores 15/15.
      - name: check-pr-text self-test
        run: bash scripts/check-pr-text.sh --self-test
      - name: scan this PR's body and comments for local-system detail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-pr-text.sh "${{ github.event.pull_request.number }}"

  test:
    runs-on: ubuntu-latest
    # Bound the job explicitly instead of relying on GitHub's 6-hour default. MEASURED across the
    # 14 `test` job runs at and before run 31644425489 (`36ea882`/#993, 2026-08-12) — a fixed run-id
    # window, not "the 14 most recent" (that phrase names a different set of runs every day) —
    # (`gh api repos/djhenry/eqoxide/actions/runs/<id>/jobs`, `started_at`/`completed_at` deltas):
    # 173s-220s wall (2m53s-3m40s). (An earlier version of this line said "~1.5 minutes", stale by
    # roughly 2x; re-derive with the same API call, same run-id ceiling, if this has drifted
    # again.) 20 minutes is still generous headroom
    # while still catching a wedged process (e.g. a reintroduced lock-order deadlock, #593) in
    # minutes instead of silently burning most of a day and reporting nothing.
    timeout-minutes: 20
    # The repo's tracked .cargo/config.toml sets `rustc-wrapper = "sccache"` and
    # `rustflags = ["-C", "link-arg=-fuse-ld=mold"]` — a local-dev speed-up for the shared dev
    # box where both tools are installed. Neither exists on a bare `ubuntu-latest` runner, and
    # a fresh checkout picks the config file up automatically (it's repo-tracked, not
    # gitignored), so an unmodified `cargo build` here fails immediately with
    # `could not execute process 'sccache ...' (never executed): No such file or directory`.
    # Rather than edit the shared config file (other agents rely on it locally), override both
    # settings via env vars scoped to this job: CARGO_BUILD_RUSTC_WRAPPER="" and RUSTFLAGS=""
    # each take precedence over their config-file counterpart and effectively erase them.
    # Verified empirically against a throwaway crate with an identical config.toml: with a
    # linker name that cannot exist anywhere (not just "absent from PATH"), the build fails
    # without the RUSTFLAGS="" override and succeeds with it, confirming the override fully
    # cancels the config file's rustflags rather than merely appending to them.
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo/registry, ~/.cargo/git, and target/ keyed on Cargo.lock. The test suite
      # itself is fast (the full workspace runs in well under a minute of actual test time on a
      # quiet box) — compiling is the slow part, so this cache is the whole cost story for this
      # workflow. Note `tools` pulls `libeq_*` from a git dependency, so the ~/.cargo/git half of
      # this cache matters now that `--workspace` builds it.
      - uses: Swatinem/rust-cache@v2

      # No extra apt packages needed: wgpu/winit's Linux backends (x11-dl, xkbcommon-dl,
      # wayland-sys, ash for Vulkan) all dlopen their native libraries at runtime via
      # `libloading` rather than linking against them at build time, so `cargo build` does not
      # require libx11-dev/libwayland-dev/libxkbcommon-dev/mesa/vulkan headers on the runner.
      # ureq uses rustls (pure Rust), not openssl-sys, so no TLS dev headers either. If a future
      # dependency bump changes this and the build step below starts failing on missing system
      # libraries, add the relevant `apt-get install` step here rather than reaching for
      # `--no-default-features` — see the fallback note below.
      # `--workspace` is load-bearing here, not decoration. A bare `cargo build --release` builds
      # only the ROOT package (the `eqoxide` lib + its `eqoxide`/`render_model` bins) and whatever
      # it depends on. Two workspace members are NOT root dependencies and were therefore never
      # release-built by CI: `tools` (the `s3d_to_gltf`/`validate_glb`/`diagnose_glb` binaries) and
      # `crates/eqoxide-crash`'s `crash_probe` bin. `--workspace` covers every member's every
      # target. See #605.
      #
      # `--keep-going` (#968): report EVERY unit that fails to compile, not just the first. Without
      # it cargo prints `warning: build failed, waiting for other jobs to finish...` and stops
      # scheduling, so a run that shows one error may be hiding others in units it never built.
      - name: cargo build --release --workspace
        run: cargo build --release --workspace --locked --keep-going

      # Compile every TEST target before running any of them, with `--keep-going` (#968).
      #
      # WHAT THIS IS FOR, measured off the Actions record rather than reconstructed. PR #896's only
      # CI run (`31123248406`) failed on `E0063: missing field npc_tint_index in initializer of
      # Entity` at `src/model.rs:430`, in `could not compile eqoxide (lib test)`. Cargo then stopped
      # scheduling, so the SECOND half of the same break — `SpawnInfo` in `tests/entity_pose_643.rs`
      # — was never compiled and never reported: the strings `entity_pose_643` and `SpawnInfo`
      # appear zero times in that entire run log. It took two follow-up PRs (#915, #918) to get
      # `main` green. The release build above would not have caught either half: it does not build
      # test targets at all.
      #
      # MEASURED at `fddcb89` on cargo 1.97.1 by appending an identical `const _PROBE_968: u32 =
      # "not a u32";` (E0308) to ALL 23 integration targets under `tests/` — the same class of leaf
      # unit as #896's `tests/entity_pose_643.rs` — then reverting it:
      #   cargo test --workspace --locked                             -> exit 101, 1-2 of 23 named
      #   cargo build --workspace --all-targets --locked              -> exit 101, 1-2 of 23 named
      #   cargo build --workspace --all-targets --locked --keep-going -> exit 101, 23  of 23 named
      # The two fail-fast rows are written as a RANGE on purpose. Without the flag, how many units
      # are named depends on how many compile jobs happened to be in flight when the first error
      # landed, so it is scheduler noise, not a property of the command: one run each here gave 1
      # and 2, and an independent reviewer's four runs each gave 2,2,2,2 and 1,2,2,2 — the two rows
      # inverted on that reviewer's first run. Neither integer is reproducible and neither is the
      # point. `23 of 23` IS exact and reproduced on every run by both of us. Note also that the
      # middle row is a fail-fast row: `--all-targets` alone is NOT what makes the report complete
      # — the flag is. Unmutated, all three exit 0.
      #
      # `warning: build failed, waiting for other jobs to finish...` is NOT the tell. All three runs
      # above print it, including the `--keep-going` one that goes on to name all 23. It means "some
      # unit failed and cargo is draining the jobs already started"; only the count of `could not
      # compile` lines distinguishes a complete report from a truncated one.
      #
      # `cargo test` CANNOT take `--keep-going` — MEASURED on cargo 1.97.1 stable:
      # `cargo test --keep-going` exits 1 with `error: unexpected argument '--keep-going' found`
      # and the tip `use --no-fail-fast`, which is a different mechanism (it keeps RUNNING tests
      # after a failure; it does not keep COMPILING after a compile error). `cargo build` does take
      # it, and `--all-targets` is what pulls the test targets into a `build`. Hence this step.
      # Re-derive with `cargo test --keep-going --no-run` in any crate.
      #
      # Small added cost: this is the dev profile, so the artifacts are the same ones `cargo test
      # --workspace` below reuses from the shared target dir — it moves the compile earlier rather
      # than duplicating it. MEASURED on this branch's tree, run immediately after a full `cargo
      # test --workspace --locked`: 6.59s, all of it the few `tools` bin targets `cargo test` does
      # not build; a second, fully warm run of the same command is 0.42s. Both are dev-box figures
      # on a warm target dir, not runner figures — the runner's cost depends on the rust-cache hit.
      #
      # WHAT IT DOES NOT COVER, so nobody reads it as more than it is:
      #   - ANYTHING DOWNSTREAM OF A BROKEN UNIT — the largest limitation of the flag. `--keep-going`
      #     fans out over units that are INDEPENDENT of the failing one; a unit that depends on it
      #     cannot be compiled at all, so it is never reported. MEASURED here the same way, by
      #     appending the same E0308 probe to `crates/eqoxide-core/src/game_state.rs` alone:
      #     `cargo build --workspace --all-targets --locked --keep-going` -> exit 101, exactly 2
      #     units named (`eqoxide-core` (lib) and `eqoxide-core` (lib test)), and `entity_pose_643`
      #     appears 0 times — the identical zero-mentions symptom this step exists to fix. The
      #     23-independent-leaf-targets mutation above is the flag's BEST case, not its typical one.
      #     A break in a dependency root reports that ONE CRATE (both of its units) and hides every
      #     crate downstream of it — 2 of 25+, not 23 of 23.
      #   - DOCTESTS. `--all-targets` does not include them (that is the same fact the test step
      #     below relies on), so a doctest that fails to COMPILE still surfaces only in `cargo
      #     test`, and still fails fast there.
      #   - TEST FAILURES. This step only compiles. `cargo test` below still stops after the first
      #     failing test binary; `--no-fail-fast` is the flag for that and is deliberately not set
      #     here, because a run that reports every failing binary is a separate change from one
      #     that reports every failing COMPILATION UNIT.
      #   - MERGING OVER A RED CHECK, which is the other half of #968 and cannot be fixed by any
      #     file in this repo. MEASURED 2026-08-12: `gh api repos/djhenry/eqoxide/branches/main/
      #     protection` returns 404 `Branch not protected`, and `gh api repos/djhenry/eqoxide/
      #     rulesets` returns `[]` — so NO check is required on `main`, and #896 was merged 33.5
      #     minutes after its only run went red (run `31123248406` concluded 2026-08-06T17:31:43Z;
      #     `merged_at` 18:05:13Z) with nothing to stop it. Making `test` a required
      #     status check is a repository-admin setting, not a workflow one; re-derive the current
      #     state with those two API calls rather than trusting this dated line.
      - name: cargo build --workspace --all-targets (compile every test target, keep going)
        run: cargo build --workspace --all-targets --locked --keep-going

      # `cargo test --workspace` — NOT `--lib`. This is the #605 fix, and the reason it matters is
      # worth stating plainly: `--lib` runs only the ROOT package's lib target. That was correct
      # when it was written (#354/#355), because the whole codebase WAS the root lib. The #544
      # crate extraction then moved ~92% of the suite into `crates/*`, and CI silently went from
      # testing everything to testing 88 of 1145 tests (1 test binary of 25) — green the entire
      # time. `--lib` also excludes every integration target under `tests/`, including
      # `walker_sim.rs`.
      #
      # Do NOT "improve" this to `--all-targets`: that would be a REGRESSION here. The repo has no
      # `benches/` and no `examples/`, so `--all-targets` adds zero coverage, and it silently DROPS
      # the doc-test targets. MEASURED at `245baeb` (#974): both commands run the byte-identical
      # set of 42 non-doctest test binaries — the `Running` target list diff is empty, including
      # all 23 integration targets under `tests/` — while `--workspace` alone additionally runs 13
      # `Doc-tests` targets carrying 15 doctests (12 passed, 3 ignored) that `--all-targets`
      # reports as 0. So `--workspace --locked` is a strict superset by that delta.
      #
      # Pass/header TOTALS are deliberately not quoted here. An earlier version of this comment
      # quoted six — `55`/`2008`/`50` versus `42`/`1997`/`47` — sourced to "one clean tree (#950)"
      # with no sha. MEASURED at `245baeb` against `143cc84` (the commit that wrote them): only the
      # two PASSED totals were wrong (`2008` plain, `1997` under `--all-targets`); the four header
      # and ignored counts still hold. Even the doctest counts above will drift eventually — they
      # are pinned to a sha for that reason, not claimed current. Re-derive with `cargo test
      # --workspace --locked` vs `cargo test --workspace --all-targets --locked`, diffing the
      # `Running` lines and `Doc-tests` sections, if you need today's numbers.
      #
      # (An earlier version of this comment said no Rust doctest existed yet; that is no longer
      # true, and the conclusion is stronger than it was, not weaker.)
      #
      # Headless-safety still holds under `--workspace`: no test in any crate constructs a
      # `wgpu::Instance` or a `winit::EventLoop` (those call sites are `src/app.rs:772` — in the
      # *lib*, not a binary — plus `src/main.rs:519` and `src/bin/render_model.rs:527`/`:700`; all
      # are startup paths no test invokes. Being in the lib target is fine: the old `--lib` gate
      # already compiled and linked `src/app.rs` headless for months, and two green
      # `ubuntu-latest` runs confirm it empirically). The renderer crate's
      # shader tests parse WGSL as text. The net-crate tests bind only `127.0.0.1:0`/`0.0.0.0:0`
      # UDP loopback sockets, which need no external network. `eqoxide-crash`'s tests exec the
      # `crash_probe` bin via `CARGO_BIN_EXE_*` (cargo builds and locates it; no display needed).
      # The `tests/asset_sync_live.rs` integration test is the only one that wants the network,
      # and it is already `#[ignore]`d.
      #
      # 50 tests are `#[ignore]`d: 47 non-doctest plus 3 ignored doctests (part of the `Doc-tests`
      # delta described above). MEASURED at `36ea882` with
      # `cargo test --workspace --locked -- --ignored --list` (50 names, cross-checked against
      # every `#[ignore]` in the tracked sources: 45 carry a reason string, 2 are bare —
      # `zone_map.rs` and `asset_sync_live.rs`, whose reasons live in an adjacent doc comment
      # instead), grouped by the *stated* environment reason each carries:
      #   - baked zone assets (`.glb`/`.wtr`) from the LAN asset server (31). What GATES them splits
      #     three ways — checked at each `env::var` call site AND by running one of each with all
      #     five vars unset, because the call site's next line is usually a fallback:
      #       - 8 REQUIRE a var and panic without it: `$ZONE_GLB` (2 in `eqoxide-assets/src/lib.rs`,
      #         4 in `collision.rs`), `$DOORS_GLB` (1, `eqoxide-assets/src/lib.rs`),
      #         `$EQOXIDE_ZONE_ASSETS` (1, `src/movement.rs`). MEASURED: unsetting `$ZONE_GLB` and
      #         running `from_glb_links_meshes_to_textures` panics — `NotPresent` — in 0.00s.
      #       - 22 treat it as an OPTIONAL OVERRIDE of a hardcoded fallback,
      #         `~/.local/share/eqoxide/assets/models`: `$ZONE_DIR` (11 in `collision.rs`, 5 in
      #         `walker_sim.rs`), `$EQZONES` (5 in `water_capability.rs` via its shared loader, 1 in
      #         `src/movement.rs`). MEASURED at `36ea882` with all five vars unset:
      #         `collision::fix_700_coarse_agrees_with_fine_at_canal_lip` still runs — `ok. 1
      #         passed`, tens of seconds of real work off that fallback path, not a 0.00s panic.
      #         The var is not a gate for this group; a populated dev-machine cache is.
      #       - 1, `worst_case_reachable_component`, hardcodes that same fallback path with NO
      #         override at all (`$ZONES` there only picks which zone NAMES to scan).
      #     So for 23 of the 31 (22 + the 1 hardcoded) what has to exist is a populated asset
      #     directory — the `~/.local/share/eqoxide/assets/models` fallback by default, or wherever
      #     the var points when one is set instead (MEASURED: with `HOME` empty and `$ZONE_DIR` set
      #     to the real cache, the same test still passes) — not the presence or absence of the
      #     variable itself. CI sets none of the five and has no such directory, which is why all 31
      #     still stay ignored here. On a fresh clone none of the five is set: the 8 REQUIRED tests
      #     fail at the variable itself, with no fallback and no path resolved; the other 23 resolve
      #     to the default `~/.local/share` fallback, which is outside the repo — no `.gitignore`
      #     rule is involved for that default path. That is a claim about the defaults nobody
      #     overrides, not about every value a var could hold: a `$ZONE_DIR` pointed inside the repo
      #     (e.g. `assets/zones/...`) would match the root-anchored `/assets` rule.
      #     Breakdown: 3 in `eqoxide-assets/src/lib.rs`, 16 in
      #     `crates/eqoxide-nav/src/collision.rs`, 2 in `src/movement.rs`, 5 in
      #     `tests/water_capability.rs`, 5 in `tests/walker_sim.rs`
      #   - bundled/cached model `.glb` (13): 11 read
      #     `concat!(env!("CARGO_MANIFEST_DIR"), "/assets/models/...")` in
      #     `crates/eqoxide-renderer/src/models.rs`, i.e. `crates/eqoxide-renderer/assets/models/`
      #     — NOT the repo-root `assets/models/`, and NOT gitignored (`.gitignore`'s only rule is
      #     the root-anchored `/assets`; `git check-ignore` on the renderer path exits 1). Nothing
      #     in the repo populates that directory; it is simply absent, and a dev who creates it
      #     sees it as untracked in `git status`. 2 more read the dev-machine model cache at
      #     `~/.local/share/eqoxide/assets/models` (`anim.rs`'s test honors an `EQOXIDE_MODELS_DIR`
      #     override; `skin_cap_selection.rs`'s does not)
      #   - extracted SOURCE assets — `tools`' `skinned_conversion_is_centered_grounded` needs
      #     `globalhum_chr.s3d` under `$EQ_ASSETS_DIR` (1)
      #   - `zone_map::diagnostic_measure_contributing_zones_869` — CI has no client cache (1)
      #   - a running asset server at `$ASSET_URL` — `tests/asset_sync_live.rs` (1)
      # They stay ignored here — see #357/#654 for giving them their own optional/asset-backed job.
      #
      # An earlier version of this comment said 29, in a 27+1+1 breakdown that could not even be
      # reconciled with the true 47 non-doctest total (#993). Like the doctest counts above, this
      # total and breakdown will drift again — they are pinned to a sha for that reason, not
      # claimed current. Re-derive with the command above if you need today's numbers.
      #
      # BE PRECISE ABOUT WHAT THIS DOES *NOT* COVER — do not read "nav is now tested in CI" into
      # the numbers above. MEASURED at `36ea882`: `cargo test -p eqoxide-nav --lib -- --ignored
      # --list` names 16 ignored tests, all of them in `crates/eqoxide-nav/src/collision.rs` — that
      # command lists the WHOLE crate's ignored set, which equals the collision.rs set only because
      # no other file in `eqoxide-nav` has an `#[ignore]`d test today (checked: no other nav source
      # file matched). Plus 5 more in `tests/walker_sim.rs` — the drift baseline
      # `faithful_walker_drift_corpus` and four blast-radius corpora
      # (`goal_append_blast_radius`,
      # `corner_buffer_blast_radius`, `descent_guard_blast_radius`,
      # `parallel_wall_clearance_blast_radius`), all gated on baked zone glbs at `$ZONE_DIR`. What
      # runs here is the synthetic-geometry half: `eqoxide-nav`'s lib target passes 282 tests (16
      # ignored) and `walker_sim.rs` passes 14 (5 ignored), including the hand-built lintel,
      # low-wall, haul-out, and mid-water-depth fixtures. Nav's deepest verification — against real
      # baked zones — still runs NOWHERE automatic (#357). Misreading a nav gate as broader than it
      # is has already cost this project once: #411/D-2 passed nav QA and regressed live.
      #
      # An earlier version of this paragraph said "12-test" / "127 unit tests" / "4 hand-built-mesh
      # cases"; none of the three survived re-derivation (#993). Re-derive with
      # `cargo test -p eqoxide-nav --lib -- --ignored --list` and `cargo test --workspace --locked`
      # if these have drifted again.
      #
      # THE ONE PLACE A FLAKE COULD COME FROM, so a future red run gets diagnosed instead of
      # papered over: `crates/eqoxide-nav/src/planner.rs` has two ABSOLUTE wall-clock assertions
      # that reach CI for the first time with this change — `post_us < 1_000` (:958) and
      # `post_us < 500` (:1011). Both measured ~2-3us here, a 150-500x margin, so the risk is low.
      # But note their doc comment's claim that "the assertions only get SAFER under CPU load" is
      # true only of the `sync_us > …` fixture-sanity halves; a >500us deschedule of the posting
      # thread on a 2-vCPU runner is rare, NOT impossible. If one of those two goes red in
      # isolation, that is this — a scheduling artifact, not a nav regression. Fix it by making
      # the assertion relative (post_us vs sync_us) rather than by narrowing the gate.
      #
      # If a test fails here, fix it or `#[ignore]` it WITH A SPECIFIC REASON. Do not narrow this
      # command back down to make it green — that is exactly the failure #605 documents.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # The shared mutation harness (#950) is how a PR body substantiates a "this check is
      # load-bearing" claim, so a harness that has quietly stopped discriminating would devalue
      # every such claim without anything going red. `--self-test` builds a throwaway crate in a
      # temporary directory (never part of any eqoxide workspace, wherever TMPDIR points) and
      # drives the real entry point through its FAILURE modes: an anchor that matches zero times
      # and one that matches twice (both must be refused), a mutant that does not compile (must
      # score INVALID — never RED, since a compile failure and a test failure both exit 101), a
      # caught mutant, a surviving one, a multi-edit mutant, and a deliberately corrupted restore.
      # It also mutates the harness itself to confirm those guards are reached rather than merely
      # present, and asserts how many checks ran — a case that stops running must fail the step,
      # not shrink the output silently.
      #
      # Same PATTERN as the check-wrapped-literals `--self-test` in the job above, not the same
      # cost: that one is in-process and sub-second, this one shells out to cargo for every case
      # that needs a real build. No wall-clock figure is quoted here on purpose — it depends on the
      # runner and on cargo's cache, and a stale number in tracked text is exactly the defect class
      # this harness exists to catch. It needs cargo, which is why it lives here and not in the
      # `no-local-detail` job. See docs/mutation-testing.md.
      - name: mutation harness self-test
        run: python3 scripts/mutate.py --self-test
