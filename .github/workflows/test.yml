name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/**"]

# Cancel superseded runs on the same ref so pushes to a PR don't queue up stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The repo's tracked .cargo/config.toml sets `rustc-wrapper = "sccache"` and mold linker
    # flags for the shared dev box. Neither exists on a bare `ubuntu-latest` runner, and a fresh
    # checkout picks the tracked config up automatically, so an unmodified `cargo build` fails
    # with `could not execute process 'sccache ...'`. Override both via env vars scoped to this
    # job rather than editing the shared config file that local agents rely on.
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--workspace` is load-bearing: a bare `cargo build --release` builds only the ROOT package,
      # which silently skipped the `tools` and `eqoxide-crash` members for months (#605).
      #
      # `--keep-going` reports EVERY unit that fails to compile rather than stopping at the first
      # (#968). Note it only fans out over units INDEPENDENT of the failing one — a break in a
      # dependency root still hides everything downstream of it.
      - name: cargo build --release --workspace
        run: cargo build --release --workspace --locked --keep-going

      # Compile every test target before running any. `cargo test` cannot take `--keep-going`
      # (it suggests `--no-fail-fast`, which is a different mechanism — that keeps RUNNING after a
      # failure, not COMPILING after a compile error), and `--all-targets` is what pulls test
      # targets into a `build`. Hence this step existing separately from the one above.
      - name: cargo build --workspace --all-targets (compile every test target, keep going)
        run: cargo build --workspace --all-targets --locked --keep-going

      # `--workspace`, NOT `--lib`: `--lib` runs only the root package's lib target, which after
      # the #544 crate extraction meant CI tested a small fraction of the suite while staying green.
      #
      # Do NOT "improve" this to `--all-targets`: the repo has no benches or examples, so it adds
      # zero coverage and silently DROPS the doctest targets. `--workspace` alone is a strict
      # superset.
      #
      # Headless-safe: no test constructs a `wgpu::Instance` or a `winit::EventLoop`; net tests bind
      # only loopback UDP. Asset-backed tests (baked zone .glb/.wtr from the LAN asset server) are
      # `#[ignore]`d — nav's deepest verification runs nowhere automatic (#357).
      #
      # If a test fails here, fix it or `#[ignore]` it WITH A SPECIFIC REASON. Do not narrow this
      # command back down to make it green — that is the failure #605 documents.
      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # Visibility only, NOT a gate (`continue-on-error: true`): as of #1110/#1020, the workspace is
      # down to 10 warnings, all `clippy::too_many_arguments` on long-lived call signatures (see e.g.
      # `eqoxide-net::gameplay`, `eqoxide-net::packet_handler`, `src/app.rs`) — fixing those means
      # redesigning those signatures, a call for whoever owns each of them, not a mechanical cleanup.
      # `-D warnings` is already wired in so flipping this to blocking later is a one-line change
      # (drop `continue-on-error`) once those sites are dealt with — don't let this step silently
      # regress to 0 warnings without someone noticing and flipping it.
      #
      # `--keep-going` per the build step above; `-D warnings` makes new warnings visible as a
      # (non-blocking) red X rather than scrolling past in a wall of green.
      - name: cargo clippy --workspace (report only, not yet a gate — #1110)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  static-visual-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      RUSTFLAGS: ""
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: client
      - uses: actions/checkout@v4
        with:
          repository: djhenry/eqoxide_asset_server
          ref: 2582fd333f1c6c83aa0167da597b9065b8bc104b
          path: producer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client -> target
            producer -> target
      - name: Fetch locked dependencies for both checkouts
        run: |
          cargo fetch --locked --manifest-path client/Cargo.toml
          cargo fetch --locked --manifest-path producer/Cargo.toml
      - name: Regenerate and decode the common fixture
        run: client/scripts/check-static-visual-fixture.sh client producer
